name: Cross repository request
description: Ask the owners of this repository for work that another repository depends on.
type: Task
labels: ["cross-repo", "status:triage"]
body:
  - type: input
    id: requested_by
    attributes:
      label: Requested by
      description: The blocked issue, as offsteel/<repo>#<number>.
      placeholder: offsteel/console#57
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: What is needed
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Expected contract or behavior
      description: Endpoint, message, schema or behavior you expect.
  - type: textarea
    id: done
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: input
    id: deadline
    attributes:
      label: Deadline or phase it blocks
      placeholder: Phase 1
